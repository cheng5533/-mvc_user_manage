<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统 - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Microsoft YaHei", Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .card h2 { 
            margin-bottom: 30px; 
            color: #333; 
            font-size: 24px;
            text-align: center;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #555; 
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 5px; 
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: #667eea;
        }
        .form-group .error { 
            color: #e74c3c; 
            font-size: 12px; 
            margin-top: 5px;
        }
        .btn { 
            width: 100%;
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
            transition: opacity 0.3s;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn:hover { 
            opacity: 0.9;
        }
        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>📝 用户注册</h2>

            <!-- 成功提示 -->
            <div class="message" th:if="${message}" th:text="${message}"></div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>用户名 <span style="color:red">*</span></label>
                    <input type="text" th:field="*{username}" placeholder="请输入用户名（2-20个字符）">
                    <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label>密码 <span style="color:red">*</span></label>
                    <input type="password" th:field="*{password}" placeholder="请输入密码（至少6位）">
                    <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    <div class="hint">密码将加密存储，请放心注册</div>
                </div>

                <div class="form-group">
                    <label>确认密码 <span style="color:red">*</span></label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入密码">
                    <div class="error" id="confirmPasswordError" style="display:none;">两次输入的密码不一致</div>
                </div>

                <div class="form-group">
                    <label>姓名 <span style="color:red">*</span></label>
                    <input type="text" th:field="*{name}" placeholder="请输入真实姓名">
                    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" th:field="*{email}" placeholder="请输入邮箱（选填）">
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label>电话</label>
                    <input type="text" th:field="*{phone}" placeholder="请输入手机号（选填）">
                </div>

                <button type="submit" class="btn btn-primary" onclick="return validatePassword()">注 册</button>
            </form>

            <div class="links">
                已有账号？<a th:href="@{/login}">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        function validatePassword() {
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var errorDiv = document.getElementById('confirmPasswordError');
            
            if (password !== confirmPassword) {
                errorDiv.style.display = 'block';
                return false;
            } else {
                errorDiv.style.display = 'none';
                return true;
            }
        }
    </script>
</body>
</html>
