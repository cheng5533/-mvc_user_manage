<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - F4的网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
        }
        .login-box { 
            background: white; 
            padding: 45px 40px; 
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); 
        }
        .logo { 
            text-align: center; 
            margin-bottom: 35px; 
        }
        .logo h1 { 
            color: #333; 
            font-size: 28px; 
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
        }
        .form-group { 
            margin-bottom: 22px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            color: #555; 
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input { 
            width: 100%; 
            padding: 13px 16px; 
            border: 2px solid #e8e8e8; 
            border-radius: 10px; 
            font-size: 15px; 
            transition: all 0.3s;
            background: #fafafa;
        }
        .form-group input:focus { 
            outline: none; 
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .form-group input::placeholder {
            color: #bbb;
        }
        .btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.35);
        }
        .btn:active {
            transform: translateY(0);
        }
        .error { 
            background: #fee;
            color: #c33; 
            text-align: center; 
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px; 
            font-size: 14px;
            border: 1px solid #fcc;
        }
        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 25px 0;
        }
        .links {
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        .links a { 
            color: #667eea; 
            text-decoration: none; 
            font-weight: 500;
            transition: color 0.2s;
        }
        .links a:hover { 
            color: #5a6fd6;
            text-decoration: underline;
        }
        .secondary-link {
            display: block;
            margin-top: 12px;
        }
        .secondary-link a {
            color: #27ae60;
        }
        @media (max-width: 480px) {
            .login-box { padding: 35px 25px; }
            .logo h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>F4的网站</h1>
                <p>欢迎回来，请登录您的账号</p>
            </div>
            
            <div class="error" th:if="${error}" th:text="${error}"></div>
            
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" required autofocus>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">登 录</button>
            </form>
            
            <div class="divider"></div>
            
            <div class="links">
                <p>还没有账号？<a th:href="@{/register}">立即注册</a></p>
                <p class="secondary-link">
                    <a th:href="@{/blog}">← 返回博客首页</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
